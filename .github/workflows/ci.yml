name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }}

      - name: Ruff lint
        run: uv run ruff check custom_components tests

      - name: Ruff format
        run: uv run ruff format --check custom_components tests

      - name: Codespell
        run: uv run codespell

  typecheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }}

      - name: mypy
        run: uv run mypy custom_components/autoarm

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # oldest supported (hacs.json) and the locked newest
        include:
          - ha-version: "2026.5"
            python-version: "3.14"
            ha-override: "2026.5.*"
          - ha-version: "2026.11"
            python-version: "3.14"

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }}

      # --no-config keeps the [tool.uv] settings in pyproject.toml out of this resolve. The test
      # harness has to move with homeassistant, as it is built against one HA release: Home
      # Assistant's own pytest-homeassistant from 2026.11, pytest-homeassistant-custom-component
      # before that (see tests/ha_testing.py)
      - name: Pin Home Assistant ${{ matrix.ha-version }}
        if: matrix.ha-override
        run: |
          uv pip uninstall pytest-homeassistant pytest-homeassistant-custom-component
          if [ "${{ matrix.ha-test-package }}" = "pytest-homeassistant" ]; then
            uv pip install --no-config "homeassistant==${{ matrix.ha-override }}" "pytest-homeassistant==${{ matrix.ha-override }}"
          else
            uv pip install --no-config "homeassistant==${{ matrix.ha-override }}" pytest-homeassistant-custom-component
          fi
          uv run --no-sync python -c "import homeassistant.const as c; v = c.__version__; print('Home Assistant', v); assert v.startswith('${{ matrix.ha-version }}.'), v"

      # --no-sync: a plain uv run would re-sync to the lock and undo the pin above
      - name: pytest
        run: |
          uv run --no-sync pytest \
            --junitxml=junit/test-results-${{ matrix.python-version }}-ha${{ matrix.ha-version }}.xml \
            --cov=custom_components.autoarm \
            --cov-report=xml \
            --cov-report=html

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pytest-results-${{ matrix.python-version }}-ha${{ matrix.ha-version }}
          path: junit/test-results-${{ matrix.python-version }}-ha${{ matrix.ha-version }}.xml
