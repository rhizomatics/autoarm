# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Github Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # releases are published, with their zip, by release.yml, as they're immutable once published

# Nothing by default; each job grants only what it needs (OpenSSF Scorecard Token-Permissions).
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    # read-only: this job runs PR code, so nothing here can write - see the publish job
    permissions:
      contents: read
      pull-requests: read

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Marketplace Action
      uses: "hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa"
      with:
        category: "integration"
    - name: Marketplace Hassfest
      uses: "home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361"
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - name: Install dependencies
      run: |
        sudo apt-get install pngquant
        uv sync
    - name: Ruff lint
      run: uv run ruff check custom_components tests
    - name: Ruff format
      run: uv run ruff format --check custom_components tests
    - name: Test with pytest
      run: |
        uv run pytest . --junitxml=junit/test-results-${{ matrix.python-version }}.xml --cov=custom_components.autoarm --cov-report=xml --cov-report=html
    - name: Upload pytest test results
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: pytest-results-${{ matrix.python-version }}
        path: |
          junit/test-results-${{ matrix.python-version }}.xml
          coverage.xml
        # Use always() to always run this step to publish test results when there are test failures
      if: ${{ always() }}
    - name: Verify docs build
      # PRs only verify the docs build, the publish job deploys them for everything else
      if: ${{ github.event_name == 'pull_request' }}
      run: |
        uv sync --group docs
        uv run properdocs build

  publish:
    # badges and docs, never for a PR, so the only job with a writable token runs no PR code
    needs: build
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-publish
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - name: Install dependencies
      run: |
        sudo apt-get install pngquant
        # the docs build needs the integration's own dependencies too, as schemagen imports homeassistant
        uv sync --group docs
    - name: Download pytest test results
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: pytest-results-${{ matrix.python-version }}
    - name: Generate badges
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        uv run genbadge coverage -i coverage.xml -o badges/coverage.svg
        uv run genbadge tests -i junit/test-results-${{ matrix.python-version }}.xml -o badges/tests.svg

        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        TEMP_DIR=$(mktemp -d)
        cd $TEMP_DIR
        git clone --single-branch --branch badges https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git . 2>/dev/null
        cp -r ${GITHUB_WORKSPACE}/badges .
        git add badges
        if git commit -m "Update badges [skip ci]"; then
          git push origin badges --force
          echo "Badges updated successfully"
        else
          echo "No changes to badges"
        fi

    - name: Deploy docs
      # only once the tests have passed, unlike the badges, which also show a failure
      if: ${{ needs.build.result == 'success' }}
      run: |
        # The token as actions/checkout would give it, but in this step's environment only, not .git/config
        export GIT_CONFIG_COUNT=1
        export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
        GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
        export GIT_CONFIG_VALUE_0
        uv run properdocs gh-deploy --force --config-file properdocs.yml
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
