site_name: Home Assistant AutoArm
site_url: https://autoarm.rhizomatics.org.uk
site_description: Automated alarm control panel arming and disarming for Home Assistant

repo_name: rhizomatics/autoarm
repo_url: https://github.com/rhizomatics/autoarm
edit_uri: edit/main/docs/

theme:
  name: materialx
  custom_dir: docs/overrides
  highlightjs: true
  language: en
  logo: assets/images/autoarm-dark-256x256.png
  icon:
    repo: fontawesome/brands/github
  features:
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search
    - search.share
    - toc.follow
    - toc.integrate
plugins:
  - search
  - autorefs
  - pagetree
  - optimize
  - meta-descriptions
  - tags
  - htmlproofer:
      skip_downloads: True
  - llmstxt:
      base_url: https://autoarm.rhizomatics.org.uk/
      preprocess: docgen/llms_preprocess.py
      markdown_description: >-
        AutoArm is a Home Assistant custom integration that arms and disarms an Alarm Control
        Panel automatically, from who's home, sunrise and sunset, and calendar events, with
        physical buttons, mobile actionable notifications and Assist voice commands for manual
        changes. Core settings are made in the UI, and advanced ones such as transition
        conditions, buttons and notification profiles in YAML.
      full_output: llms-full.txt
      sections:
        Start here:
          - index.md: Overview of what AutoArm does
          - automated_arming.md: How the armed state is worked out, and the actions and voice commands
        Configuration:
          # fnmatch's * also matches /, so this picks up configuration/examples/ too
          - configuration/*.md
        Using AutoArm:
          - mobile_actions.md: Arming and disarming from mobile actionable notifications
        Help:
          - troubleshooting.md: Diagnosing arming, calendar and notification problems
          - known_limitations.md: What AutoArm doesn't do, or does with caveats
        # changelog, roadmap and developer pages left out - old or planned behaviour an agent would
        # take as current
  - minify:
      minify_html: true
  - git-revision-date-localized:
      enable_creation_date: true
  - coverage:
      page_path: developer/coverage
      html_report_dir: htmlcov
  - mkdocstrings:
      handlers:
      # See: https://mkdocstrings.github.io/python/usage/
        python:
          options:
            show_source: false
            show_root_heading: true
            summary: true
            show_inheritance_diagram: false
            overloads_only: true
            show_if_no_docstring: false

extra_javascript:
  - javascripts/markdown_actions.js

hooks:
  # records the site directory for the llmstxt preprocess
  - docgen/llms_preprocess.py

watch:
  - custom_components/autoarm

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true
  - sane_lists
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
