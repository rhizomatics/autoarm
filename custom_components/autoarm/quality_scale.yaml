rules:
  # ============================================================================
  # Bronze Tier
  # ============================================================================

  action-setup:
    status: done
    comment: |
      The reload, enquire_configuration and reset_state actions are registered in
      async_setup. reset_state raises a translated ServiceValidationError when no
      config entry is loaded.

  appropriate-polling:
    status: exempt
    comment: |
      This integration is primarily event-driven (state changes, sunrise/sunset,
      button presses, mobile actions), and its entities are pushed rather than polled.
      Calendar polling is configurable per-calendar, defaulting to every 15 minutes.

  brands:
    status: done
    comment: |
      Brand assets submitted and approved in the Home Assistant brands repository.

  common-modules:
    status: done
    comment: |
      Common patterns are placed in dedicated modules: const.py (constants/schemas),
      helpers.py (utilities), hass_api.py (HA API wrapper), calendar_events.py
      (calendar logic) and entity.py (base entity for the status entities).

  config-flow:
    status: done
    comment: |
      Config flow implemented in config_flow.py with user flow (3 steps:
      alarm panel, calendars, persons), YAML import flow, and options flow.
      Advanced config (transitions, buttons, notify, diurnal, rate_limit)
      remains in YAML.

  config-flow-test-coverage:
    status: done
    comment: |
      Config flow tests in tests/autoarm/test_config_flow.py cover user flow,
      minimal flow, duplicate abort, import flow, import abort, and options flow.

  dependency-transparency:
    status: done
    comment: |
      No external Python packages are required. The only hard dependency is the
      alarm_control_panel component; others (calendar, conversation, local_calendar,
      mobile_app, notify, sun, supernotify) are after_dependencies in manifest.json.

  docs-actions:
    status: done
    comment: |
      Services are documented in services.yaml and README.md describes the reload,
      enquire_configuration, and reset_state actions.

  docs-high-level-description:
    status: done
    comment: |
      README.md provides a clear overview of AutoArm's purpose: automating alarm
      control panel state based on occupancy, time, calendar events, and manual
      interventions.

  docs-installation-instructions:
    status: done
    comment: |
      README.md includes HACS installation instructions and links to detailed
      configuration guides.

  docs-removal-instructions:
    status: done
    comment: |
      Removal instructions documented in docs/configuration/removal.md covering
      deleting the integration entry, HACS removal, manual removal, and cleanup steps.

  entity-event-setup:
    status: done
    comment: |
      Entities subscribe to the armer's status updates with a dispatcher signal in
      async_added_to_hass, and unsubscribe with async_on_remove (entity.py).

  entity-unique-id:
    status: done
    comment: |
      Each entity's unique_id is the config entry id with the entity key
      (entity.py).

  has-entity-name:
    status: done
    comment: |
      Entities set _attr_has_entity_name, with translated names, on the AutoArm
      service device (entity.py).

  runtime-data:
    status: done
    comment: |
      The armer is kept in ConfigEntry.runtime_data, typed with the
      AutoArmConfigEntry alias.

  test-before-configure:
    status: exempt
    comment: |
      No connection to a device or service to test; the config flow only
      selects existing Home Assistant entities.

  test-before-setup:
    status: done
    comment: |
      Setup validates configuration via CONFIG_SCHEMA (voluptuous) and checks
      for required config in async_setup. async_setup_entry raises
      ConfigEntryNotReady on initialization failure so HA retries.
      Transition conditions are validated during initialize_logic() with
      issues raised via the repair system for invalid configs.

  unique-config-entry:
    status: done
    comment: |
      Config flow sets unique_id = DOMAIN and calls _abort_if_unique_id_configured()
      to prevent duplicate entries. Only one AutoArm instance is supported.

  # ============================================================================
  # Silver Tier
  # ============================================================================

  action-exceptions:
    status: done
    comment: |
      Service handlers raise HomeAssistantError on failure: reload raises on
      YAML parse errors, enquire_configuration raises when no entry exists or
      serialization fails.

  config-entry-unloading:
    status: done
    comment: |
      async_unload_entry unloads the sensor and binary_sensor platforms and
      calls the armer's shutdown(), which removes all listeners.

  docs-configuration-parameters:
    status: done
    comment: |
      Configuration parameters are documented in docs/automated_arming.md and
      example configurations in docs/configuration/examples/.

  docs-installation-parameters:
    status: done
    comment: |
      The config flow settings are listed in docs/configuration/examples/typical.md,
      with the alarm panel choice in docs/configuration/create_panel.md.

  entity-unavailable:
    status: exempt
    comment: |
      The entities report AutoArm's own state, which is always available while the
      config entry is loaded. Home Assistant marks them unavailable when it unloads.

  integration-owner:
    status: done
    comment: |
      Code owner @jeyrb is declared in manifest.json and actively maintains
      the integration.

  log-when-unavailable:
    status: exempt
    comment: |
      AutoArm has no connection of its own to a device or service that can become
      unavailable.

  parallel-updates:
    status: done
    comment: |
      PARALLEL_UPDATES = 0 in sensor.py and binary_sensor.py, since the entities
      are pushed and never updated by Home Assistant.

  reauthentication-flow:
    status: exempt
    comment: |
      No authentication required; this integration orchestrates local HA
      entities only.

  test-coverage:
    status: done
    comment: |
      Test suite maintains >90% coverage with --cov-fail-under=90 enforced
      in pyproject.toml.

  # ============================================================================
  # Gold Tier
  # ============================================================================

  devices:
    status: done
    comment: |
      The status entities belong to a single AutoArm service device
      (DeviceEntryType.SERVICE) for the config entry.

  diagnostics:
    status: done
    comment: |
      diagnostics.py exposes config entry data, options, YAML keys, and
      armer runtime state (alarm panel, calendar count, person entities,
      health tracker status).

  discovery:
    status: exempt
    comment: |
      This integration orchestrates user-configured entities; there is nothing
      to discover automatically.

  discovery-update-info:
    status: exempt
    comment: |
      No discovery; not applicable.

  docs-data-update:
    status: done
    comment: |
      README.md and automated_arming.md describe how data is updated via
      event listeners, calendar polling, and manual triggers.

  docs-examples:
    status: done
    comment: |
      Example configurations are provided in docs/configuration/examples/
      including minimal.md and typical.md. Mobile action examples in
      docs/mobile_actions.md.

  docs-known-limitations:
    status: done
    comment: |
      Known limitations documented in docs/known_limitations.md covering
      single panel, YAML-only advanced features, calendar polling, manual
      intervention lock, and panel compatibility.

  docs-supported-devices:
    status: exempt
    comment: |
      This integration works with any alarm_control_panel, person, calendar,
      and button entities. No specific device compatibility to document.

  docs-supported-functions:
    status: done
    comment: |
      Supported functionality (occupancy tracking, calendar integration,
      button control, mobile actions, notifications) is documented in
      README.md and automated_arming.md.

  docs-troubleshooting:
    status: done
    comment: |
      Troubleshooting guide in docs/troubleshooting.md covering common issues
      with state changes, calendar detection, notifications, repair issues,
      and debug logging.

  docs-use-cases:
    status: done
    comment: |
      Use cases are illustrated in README.md ("Why use alarm control panels?"
      section) and throughout the documentation.

  dynamic-devices:
    status: exempt
    comment: |
      There is only one service device, created with the config entry.

  entity-category:
    status: done
    comment: |
      binary_sensor.autoarm_initialized and sensor.autoarm_failures are
      EntityCategory.DIAGNOSTIC.

  entity-device-class:
    status: done
    comment: |
      sensor.autoarm_last_calculation is a timestamp and
      sensor.autoarm_last_intervention an enum of change sources. No device class
      fits the others.

  entity-disabled-by-default:
    status: exempt
    comment: |
      All exposed entities are essential for operation and debugging. None
      are noisy or rarely used.

  entity-translations:
    status: done
    comment: |
      Entity names use translation keys, translated for every supported language.

  exception-translations:
    status: todo
    comment: |
      Repair issues and the reset_state not loaded error are translated, but the
      HomeAssistantError exceptions raised by the reload and enquire_configuration
      actions use English messages rather than translation keys.

  icon-translations:
    status: todo
    comment: |
      No icons.json; the status entities use their platform's default icons.

  reconfiguration-flow:
    status: todo
    comment: |
      There is no reconfigure step. The options flow does let the alarm panel,
      calendars, persons and other settings be changed, reloading the entry.

  repair-issues:
    status: done
    comment: |
      Repair issues are raised for invalid transition conditions via
      hass_api.raise_issue() from initialize_logic(). Uses proper translation
      keys and severity levels.

  stale-devices:
    status: exempt
    comment: |
      There is only one service device, removed with the config entry.

  # ============================================================================
  # Platinum Tier
  # ============================================================================

  async-dependency:
    status: exempt
    comment: |
      No external library dependency; everything uses Home Assistant's own
      async APIs.

  inject-websession:
    status: exempt
    comment: |
      No external HTTP calls requiring websession injection.

  strict-typing:
    status: in progress
    comment: |
      Type hints are used throughout. py.typed marker is present. Some `Any`
      types remain due to HA ConfigType and service data patterns.
